[project]
name = "fitosanitarios"
version = "0.1.0"
description = "Agente conversacional por WhatsApp para recetas fitosanitarias (TP2 IA)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-genai>=1.0",
    "groq>=0.11",
    "tenacity>=9.0",
    "sentence-transformers>=6.0.1",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitosanitarios"]
