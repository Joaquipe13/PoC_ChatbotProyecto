[project]
name = "fitosanitarios"
version = "0.1.0"
description = "Agente conversacional por WhatsApp para recetas fitosanitarias (TP2 IA)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-genai>=1.0",
    "groq>=0.11",
    "tenacity>=9.0",
    "sentence-transformers>=6.0.1",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.5",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "pyproj>=3.8.0",
    "pytesseract>=0.3.13",
    "fpdf2>=2.8.8",
    "langchain-core>=1.6.3",
    "pillow>=12.3.0",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/: script de demo, no código de producción -- necesita reordenar
# sys.path antes de importar el paquete propio, lo que dispara E402 sin
# aportar nada (ver DECISIONES.md, Fase 8).
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitosanitarios"]
