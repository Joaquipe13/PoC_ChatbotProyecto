id: plan_dictamen_y_agenda
conjunto: plan
persona: >
  Sergio, contratista de aplicaciones de El Trébol. Escribe en frases completas y sabe los
  datos de la receta de memoria.
objetivo: >
  Validar la receta (Flyer 10 Ec en soja, 170 cm3/ha, terrestre, en El Trébol, contra
  chinche de la alfalfa) y, si está bien, agendar la aplicación para el lunes a las 9.
  Quiere saber qué tiempo va a hacer.
datos:
  producto: Flyer 10 Ec
  dosis: 170 cm3/ha
  cultivo: soja
  plaga: chinche de la alfalfa
  tipo_de_aplicacion: terrestre
  localidad: El Trébol
comportamiento: >
  Da todos los datos en el primer mensaje. Si el resultado es apto y le ofrecen agendar,
  acepta y dice "el lunes a las 9". Termina cuando ve la aplicación agendada.
# Una receta dada por texto va a `evaluar_riesgo`: sin observaciones, ofrece agendar.
expectativas_duras:
  - {tipo: algun_turno_tipo, valor: dictamen}
  - {tipo: texto_no_contiene, valor: por encima del rango registrado}
  - {tipo: alguna_tool, valor: agendar_aplicacion}
  - {tipo: texto_contiene, valor: Pronóstico en El Trébol}
tools_esperadas: [evaluar_riesgo, agendar_aplicacion]
