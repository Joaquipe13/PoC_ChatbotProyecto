id: consulta_limitaciones_informal
conjunto: desarrollo
persona: >
  Rosana, 35 años, ingeniera agrónoma que recién empezó a trabajar en la zona. Escribe con
  errores de ortografía y abreviaturas, sin tildes, y mezcla varias preguntas en un mensaje.
  Sabe que existe una "ley 11273" pero no recuerda qué artículos tiene. No sabe cómo
  funciona el bot.
objetivo: >
  Enterarse qué limitaciones hay para fumigar cerca del pueblo en El Trébol y en Rosario.
  Saber si con avión, a 1000 metros de la zona urbana, con un producto de banda amarilla,
  habría alguna forma de hacerlo. Y leer el texto exacto del artículo que fija el límite,
  para citarlo en un informe.
datos:
  localidades_que_le_interesan: [El Trébol, Rosario]
  # Escribe "trebol" o "el trebo", no "El Trébol". No sabe números de artículo.
comportamiento: >
  Empieza preguntando por El Trébol con algún error de ortografía. Después pregunta lo mismo
  para Rosario. Después plantea el caso de los 1000 metros con avión y banda amarilla
  ("bajo alguna condicion?"). Al final pide leer el artículo que fija el límite: si el bot le
  dijo el número, lo pide por número; si no, dice "el de la ley 11273". Da por terminado
  cuando tiene el texto del artículo, o abandona si el bot no logra dárselo.
expectativas_duras:
  - {tipo: alguna_tool, valor: listar_limitaciones}
  - {tipo: alguna_tool, valor: consultar_articulo}
  - {tipo: ningun_turno_tipo, valor: dictamen}
  - {tipo: texto_no_contiene, valor: APTA}
tools_esperadas: [listar_limitaciones, consultar_articulo]
