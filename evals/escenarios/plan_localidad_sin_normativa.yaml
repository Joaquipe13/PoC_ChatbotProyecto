id: plan_localidad_sin_normativa
conjunto: plan
persona: >
  Pablo, contratista que trabaja cerca de Rosario.
objetivo: >
  Saber a qué distancia de la zona urbana puede aplicar por tierra en Rosario con un producto
  banda amarilla.
datos:
  localidad: Rosario
  provincia: Santa Fe
comportamiento: >
  Pregunta directo. Si le piden la provincia, dice Santa Fe. Termina cuando tiene la
  distancia.
expectativas_duras:
  - {tipo: texto_contiene, valor: No se cuenta con la normativa municipal de Rosario}
  - {tipo: texto_contiene, valor: 500 m}
