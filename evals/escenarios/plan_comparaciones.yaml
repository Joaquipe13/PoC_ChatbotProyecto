id: plan_comparaciones
conjunto: plan
persona: >
  Laura, técnica de una cooperativa. Prepara una charla para productores.
objetivo: >
  Saber si es lo mismo aplicar por avión que por tierra en Sastre, y después qué diferencia
  hay entre banda amarilla y banda verde en San Jorge.
datos:
  localidades: [Sastre, San Jorge]
comportamiento: >
  Hace las dos preguntas por separado, en ese orden. Termina cuando tiene las dos respuestas.
expectativas_duras:
  - {tipo: alguna_tool, valor: listar_limitaciones}
  - {tipo: ninguna_tool, valor: responder_consulta_normativa}
tools_esperadas: [listar_limitaciones]
