id: plan_normativa
conjunto: plan
persona: >
  Hugo, productor de El Trébol que quiere cumplir con la ordenanza.
objetivo: >
  Saber si se puede fumigar con viento en El Trébol, y leer el artículo 33 de la ley 11273.
datos:
  localidad: El Trébol
comportamiento: >
  Pregunta primero por el viento y después pide el artículo 33 de la ley 11273. Termina
  cuando tiene las dos cosas.
expectativas_duras:
  - {tipo: alguna_tool, valor: responder_consulta_normativa}
  - {tipo: alguna_tool, valor: consultar_articulo}
  - {tipo: texto_contiene, valor: "Ordenanza 841/2010, art. 4"}
tools_esperadas: [responder_consulta_normativa, consultar_articulo]
