id: plan_banda_de_producto
conjunto: plan
persona: >
  Carla, productora. Quiere saber la banda de dos productos que tiene en el galpón.
objetivo: >
  Saber qué banda toxicológica tiene el Tordon D 30, y después la del Roundup.
datos:
  productos: [Tordon D 30, Roundup]
  roundup_exacto: Roundup Max   # si le preguntan cuál Roundup, elige este
comportamiento: >
  Pregunta primero por el Tordon D 30 y después por el Roundup. Si le ofrecen varias opciones
  de Roundup, elige "Roundup Max". Termina cuando sabe la banda de los dos.
expectativas_duras:
  - {tipo: alguna_tool, valor: validar_producto_registro}
  - {tipo: ninguna_tool, valor: consultar_marbete}
  - {tipo: texto_contiene, valor: azul}
tools_esperadas: [validar_producto_registro]
