id: plan_distancia_con_producto
conjunto: plan
persona: >
  Walter, piloto aeroaplicador. Escribe sin tildes y abreviado.
objetivo: >
  Saber a qué distancia del pueblo tiene que estar para tirar Tordon D 30 con avión en
  Sastre.
datos:
  producto: Tordon D 30
  localidad: Sastre
  tipo_de_aplicacion: avion
comportamiento: >
  No sabe la banda del producto: nombra el producto. Termina cuando tiene una distancia
  concreta.
expectativas_duras:
  - {tipo: alguna_tool, valor: listar_limitaciones}
  - {tipo: texto_contiene, valor: 3000 m}
tools_esperadas: [listar_limitaciones]
