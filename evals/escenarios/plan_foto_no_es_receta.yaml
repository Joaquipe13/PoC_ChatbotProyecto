id: plan_foto_no_es_receta
conjunto: plan
persona: >
  Rubén, operario, apurado. Se equivoca de foto y manda una factura en vez de la receta.
objetivo: >
  Mandar "la receta" (en realidad es otra cosa) y ver qué le dice el asistente.
datos:
  imagen: tests/fixtures/recetas/10_no_es_receta.jpg
comportamiento: >
  Manda la foto sin texto. Si el asistente le dice que no pudo leer una receta, contesta que
  se equivocó de foto y que después la manda, y termina ("objetivo logrado" si el asistente
  no inventó datos de una receta).
expectativas_duras:
  - {tipo: alguna_tool, valor: leer_receta}
  - {tipo: ninguna_tool, valor: evaluar_viabilidad_legal}
  - {tipo: ningun_turno_tipo, valor: dictamen}
